# 项目依赖与构建配置（pyproject.toml）。
#
# 设计说明（教学向）
# =================
# 1. 规格 §3.2 要求用 pyproject.toml 管理依赖，统一现代 Python 打包标准。
# 2. 这里只声明 Phase 0 必需的依赖；后续 Phase（embedding/reranker/Celery 等）
#    会按需追加，避免一开始就装一堆用不到的包。
# 3. 测试相关依赖放在 optional-dependencies 的 test 组，开发时用
#    `pip install -e ".[test]"` 一次性装齐。

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec-rag-agent"
version = "0.1.0"
description = "网络安全领域 RAG 知识库系统（Phase 0：项目初始化骨架）"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # Web 框架
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # 配置与数据校验（Pydantic v2）
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    # 数据库 ORM
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    # 缓存与任务状态
    "redis>=5.0",
    # 向量检索客户端
    "qdrant-client>=1.7",
    # HTTP 客户端（TestClient 依赖）
    "httpx>=0.27",
]

[project.optional-dependencies]
# 测试相关依赖
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# ---- setuptools 显式声明包，避免后端自动发现把 tests 当成包 ----
# package-dir 把根 "" 映射到 backend/，因为 app 包位于 backend/app。
[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app", "app.api", "app.db", "app.models", "app.schemas",
            "app.services", "app.workers", "app.utils"]

[tool.pytest.ini_options]
# 测试根目录指向 backend/tests
testpaths = ["backend/tests"]
# 自定义标记：integration 标记的测试需要真实基础设施（PG/Redis/Qdrant）
markers = [
    "integration: 需要真实 PostgreSQL/Redis/Qdrant 的集成测试（默认可通过 -m 'not integration' 跳过）",
]
# 默认只跑非集成测试，避免无基础设施时 CI 报错
addopts = "-m 'not integration'"
