# Alembic 配置。
#
# 设计说明（教学向）
# =================
# 1. Phase 1 开始正式启用 Alembic，用于统一管理数据库 schema 迁移。
# 2. 数据库真实连接地址不硬编码在本文件中，而是在 env.py 中复用 app.config 的 Settings。
# 3. script_location 指向 backend/alembic，使仓库结构与当前项目布局一致。

[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
